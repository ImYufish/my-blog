<!-- 一言（Hitokoto）：放在这里会被编译进同一份 DOM，由 MainGridLayout.astro 的全局脚本填充。
     可用参数（与文章 ::hitokoto 指令一致）：
       data-type="a"          只从某分类抽取；可多分类 data-type="i,d"；省略则用全局启用分类
       data-source="true"     显示出处（data-author / data-category 同理）
     示例：只显示一句动漫(a)分类、不带出处 -->
<div class="hitokoto-inline hitokoto-footer" data-hitokoto-inline data-type="a"></div>
<!--
  页脚自定义区（被 Footer.astro 用 set:html 插进页脚）：
  字号/行距跟随页脚其它行，不要再写内联 font-size；备案/又拍云这几行用
  「灰色文字（继承包裹层的 text-50）+ 悬停变主题色」，比直接用主题色安静。
-->
<div class="mx-0.5 my-2.5 flex flex-col items-center gap-y-1">
  <div>
    <a class="transition link hover:text-(--primary) font-medium"
      href="https://www.upyun.com/?utm_source=lianmeng&utm_medium=referral" target="_blank"
      rel="noopener noreferrer">本网站由又拍云提供云存储服务</a>
  </div>
  <!-- 备案合成一行：ICP → 公安备案 → 萌ICP，中间用 | 分隔 -->
  <div class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1">

      rel="noopener noreferrer">桂ICP备2022004680号</a>
    <span aria-hidden="true">|</span>
    <a class="transition link hover:text-(--primary) font-medium"
      href="https://beian.mps.gov.cn/#/query/webSearch?code=45072102000631" target="_blank"
      rel="noopener noreferrer">桂公网安备45072102000631号</a>
    <span aria-hidden="true">|</span>
    <a class="transition link hover:text-(--primary) font-medium" href="https://icp.gov.moe/?keyword=20223352"
      target="_blank" rel="noopener noreferrer">萌ICP备20223352号</a>
  </div>
</div>
